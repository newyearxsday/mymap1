
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카카오맵 장소 검색</title>

  <!-- 카카오맵 SDK를 불러오기 -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=53f0341bd38717151888f5e0a084a81d&libraries=services&autoload=false">
  </script>

  <style>
    /* 전체 화면 설정 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* 왼쪽 검색 영역 */
    #sidebar {
      width: 350px;
      min-width: 300px;
      padding: 24px 18px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #dddddd;
    }

    h2 {
      margin: 0 0 8px;
      color: #222222;
    }

    #description {
      margin: 0 0 20px;
      color: #777777;
      font-size: 13px;
    }

    /* 검색창과 버튼 */
    #searchForm {
      display: flex;
      gap: 8px;
    }

    #keyword {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #cccccc;
      border-radius: 8px;
      font-size: 14px;
    }

    #searchButton {
      padding: 0 15px;
      border: none;
      border-radius: 8px;
      background: #fee500;
      color: #222222;
      font-weight: bold;
      cursor: pointer;
    }

    #searchButton:hover {
      background: #f5dc00;
    }

    /* 상태 안내 문구 */
    #status {
      margin: 14px 0;
      color: #666666;
      font-size: 13px;
      line-height: 1.5;
    }

    /* 검색 결과 목록 */
    #resultList {
      flex: 1;
      overflow-y: auto;
    }

    .place-item {
      padding: 14px 8px;
      border-bottom: 1px solid #eeeeee;
      cursor: pointer;
    }

    .place-item:hover {
      background: #fffbea;
    }

    .place-name {
      margin-bottom: 6px;
      font-size: 15px;
      font-weight: bold;
      color: #222222;
    }

    .place-address {
      margin-bottom: 6px;
      font-size: 12px;
      color: #666666;
      line-height: 1.5;
    }

    .place-category {
      font-size: 11px;
      color: #999999;
    }

    .place-link {
      display: inline-block;
      margin-top: 8px;
      color: #3366cc;
      font-size: 12px;
      text-decoration: none;
    }

    /* 오른쪽 지도 영역 */
    #map {
      flex: 1;
      height: 100%;
      min-width: 0;
      background: #eeeeee;
    }

    /* 작은 화면 대응 */
    @media (max-width: 650px) {
      #sidebar {
        width: 42%;
        min-width: 170px;
        padding: 16px 10px;
      }

      #map {
        flex: 1;
      }

      #searchForm {
        flex-direction: column;
      }

      #searchButton {
        padding: 11px;
      }
    }
  </style>
</head>

<body>
  <!-- 왼쪽 검색창과 결과 목록 -->
  <aside id="sidebar">
    <h2>장소 검색</h2>
    <p id="description">원하는 장소를 검색해 보세요.</p>

    <form id="searchForm">
      <input
        id="keyword"
        type="text"
        placeholder="예: 카페, 도서관, 약국"
        autocomplete="off"
      >
      <button id="searchButton" type="submit">검색</button>
    </form>

    <p id="status" role="status" aria-live="polite">
      지도를 불러오는 중입니다...
    </p>

    <div id="resultList"></div>
  </aside>

  <!-- 오른쪽 지도 -->
  <main id="map"></main>

  <script>
    // 지도와 검색에 필요한 변수
    let map;
    let places;
    let currentMarker;
    let placeMarkers = [];
    let currentPosition = null;
    let mapReady = false;

    // HTML 요소 가져오기
    const searchForm = document.getElementById("searchForm");
    const keywordInput = document.getElementById("keyword");
    const statusText = document.getElementById("status");
    const resultList = document.getElementById("resultList");

    // 기본 위치: 서울시청
    const defaultPosition = new kakao.maps.LatLng(
      37.5665,
      126.9780
    );

    // 카카오맵 SDK가 완전히 준비된 뒤 실행
    window.addEventListener("load", function () {
      if (typeof kakao === "undefined" || !kakao.maps) {
        statusText.textContent =
          "카카오맵 SDK를 불러오지 못했습니다. API 키와 인터넷 연결을 확인해 주세요.";
        return;
      }

      kakao.maps.load(function () {
        initializeMap();
      });
    });

    // 지도 초기화
    function initializeMap() {
      try {
        const mapContainer = document.getElementById("map");

        const mapOptions = {
          center: defaultPosition,
          level: 5
        };

        // 지도 객체 생성
        map = new kakao.maps.Map(mapContainer, mapOptions);

        // 장소 검색 서비스 생성
        places = new kakao.maps.services.Places(map);

        // 기본 위치에 우선 마커 표시
        currentMarker = new kakao.maps.Marker({
          position: defaultPosition,
          map: map
        });

        // 지도 타일 로딩이 완료된 뒤 검색 기능 활성화
        kakao.maps.event.addListener(
          map,
          "tilesloaded",
          function () {
            if (mapReady) return;

            mapReady = true;
            statusText.textContent =
              "지도가 준비되었습니다. 장소를 검색해 보세요.";

            // 지도 로딩 후 현재 위치 확인
            getCurrentLocation();
          }
        );

        // 혹시 지도 타일 이벤트가 발생하지 않는 경우를 대비한 초기 안내
        statusText.textContent =
          "지도를 표시하고 있습니다...";

      } catch (error) {
        console.error("지도 초기화 오류:", error);
        statusText.textContent =
          "지도 초기화에 실패했습니다. API 설정을 확인해 주세요.";
      }
    }

    // 현재 위치 가져오기
    function getCurrentLocation() {
      if (!navigator.geolocation) {
        statusText.textContent =
          "위치 기능을 지원하지 않아 서울시청을 표시합니다.";
        return;
      }

      statusText.textContent =
        "현재 위치 권한을 확인하고 있습니다...";

      navigator.geolocation.getCurrentPosition(
        function (position) {
          // 현재 위치 좌표 저장
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          currentPosition = new kakao.maps.LatLng(
            latitude,
            longitude
          );

          // 지도 중심을 현재 위치로 이동
          map.setCenter(currentPosition);
          map.setLevel(5);

          // 기존 마커 위치 변경
          currentMarker.setPosition(currentPosition);

          statusText.textContent =
            "현재 위치를 지도에 표시했습니다.";
        },
        function (error) {
          // 위치를 가져오지 못하면 기본 위치 유지
          console.warn("현재 위치 확인 실패:", error);

          if (error.code === 1) {
            statusText.textContent =
              "위치 권한이 거부되어 서울시청을 표시합니다.";
          } else {
            statusText.textContent =
              "현재 위치를 확인할 수 없어 서울시청을 표시합니다.";
          }
        },
        {
          enableHighAccuracy: false,
          timeout: 10000,
          maximumAge: 60000
        }
      );
    }

    // 검색창에서 엔터 또는 검색 버튼을 누르면 실행
    searchForm.addEventListener("submit", function (event) {
      event.preventDefault();

      if (!mapReady || !places) {
        statusText.textContent =
          "지도가 준비될 때까지 잠시 기다려 주세요.";
        return;
      }

      const keyword = keywordInput.value.trim();

      if (keyword === "") {
        statusText.textContent =
          "검색할 장소 이름을 입력해 주세요.";
        keywordInput.focus();
        return;
      }

      statusText.textContent = "장소를 검색하고 있습니다...";
      resultList.replaceChildren();
      clearPlaceMarkers();

      // 입력한 키워드로 장소 검색
      places.keywordSearch(keyword, function (data, status) {
        if (status === kakao.maps.services.Status.OK) {
          showSearchResults(data);
        } else if (
          status === kakao.maps.services.Status.ZERO_RESULT
        ) {
          statusText.textContent =
            "검색 결과가 없습니다. 다른 검색어를 입력해 보세요.";
        } else {
          statusText.textContent =
            "검색 중 오류가 발생했습니다. 다시 시도해 주세요.";
        }
      });
    });

    // 검색 결과 목록과 지도 마커 표시
    function showSearchResults(data) {
      statusText.textContent =
        "검색 결과 " + data.length + "개";

      const bounds = new kakao.maps.LatLngBounds();

      data.forEach(function (place) {
        const position = new kakao.maps.LatLng(
          Number(place.y),
          Number(place.x)
        );

        // 검색 장소에 마커 추가
        const marker = new kakao.maps.Marker({
          map: map,
          position: position
        });

        placeMarkers.push(marker);
        bounds.extend(position);

        // 결과 항목 생성
        const item = document.createElement("div");
        item.className = "place-item";

        const name = document.createElement("div");
        name.className = "place-name";
        name.textContent = place.place_name;

        const address = document.createElement("div");
        address.className = "place-address";
        address.textContent =
          place.road_address_name ||
          place.address_name ||
          "주소 정보 없음";

        const category = document.createElement("div");
        category.className = "place-category";
        category.textContent =
          place.category_name || "분류 정보 없음";

        item.append(name, address, category);

        // 카카오맵 상세 페이지 링크 추가
        if (place.place_url) {
          const link = document.createElement("a");
          link.className = "place-link";
          link.href = place.place_url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "카카오맵에서 보기";

          item.appendChild(link);
        }

        // 결과를 누르면 해당 장소로 지도 이동
        item.addEventListener("click", function (event) {
          if (event.target.closest("a")) return;

          map.panTo(position);
          map.setLevel(5);

          // 클릭한 마커를 지도 중심으로 이동
          map.setCenter(position);
        });

        // 마커를 클릭해도 해당 장소를 확인할 수 있도록 설정
        kakao.maps.event.addListener(marker, "click", function () {
          map.panTo(position);
        });

        resultList.appendChild(item);
      });

      // 검색된 장소들이 모두 보이도록 지도 범위 조정
      if (data.length === 1) {
        map.setCenter(bounds.getCenter());
        map.setLevel(5);
      } else if (data.length > 1) {
        map.setBounds(bounds);
      }
    }

    // 이전 검색 결과의 마커 제거
    function clearPlaceMarkers() {
      placeMarkers.forEach(function (marker) {
        marker.setMap(null);
      });

      placeMarkers = [];
    }
  </script>
</body>
</html>
